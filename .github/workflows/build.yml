name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.169.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go
        run: |
          test -z "$(gofmt -l generator.go)" || { gofmt -d generator.go; exit 1; }
          go vet ./...

      - name: Shell scripts
        run: shellcheck -S warning generate.sh release.sh scripts/fetch_upstream.sh

  build:
    runs-on: ubuntu-latest
    env:
      # Preview is published on pushes to master, and on manual runs of any branch
      PREVIEW: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Docs are always built from the latest releases of all addons
      - name: Fetch latest releases
        run: ./scripts/fetch_upstream.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Hugo
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      - name: Build
        working-directory: src
        run: hugo -d "$RUNNER_TEMP/site"

      - name: Check site
        run: python3 scripts/check_site.py "$RUNNER_TEMP/site"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site

      # Preview on this repo's GitHub Pages (production is elementumorg.github.io and elementum.surge.sh)
      - name: Configure Pages
        id: pages
        if: env.PREVIEW == 'true'
        uses: actions/configure-pages@v5

      - name: Build preview
        if: env.PREVIEW == 'true'
        working-directory: src
        run: |
          hugo -d "$RUNNER_TEMP/pages" --baseURL "${{ steps.pages.outputs.base_url }}/"
          python3 ../scripts/check_site.py "$RUNNER_TEMP/pages" "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v3
        if: env.PREVIEW == 'true'
        with:
          path: ${{ runner.temp }}/pages

  preview:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
